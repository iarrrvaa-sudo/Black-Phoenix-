name: Build APK

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main
  workflow_dispatch:

jobs:
  build:
    name: Build Debug APK
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup JDK 11
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '11'

      - name: Extract ZIP
        run: |
          mkdir -p project
          unzip -o ./*.zip -d project

      - name: Locate Gradle project
        run: |
          GRADLEW=$(find project -type f -name gradlew | head -n 1)

          if [ -z "$GRADLEW" ]; then
            echo "gradlew tidak ditemukan."
            find project -maxdepth 5 -type f | sort
            exit 1
          fi

          PROJECT_DIR=$(dirname "$GRADLEW")
          echo "PROJECT_DIR=$PROJECT_DIR" >> "$GITHUB_ENV"

          echo "Gradle project ditemukan:"
          echo "$PROJECT_DIR"

      - name: Enable AndroidX
        working-directory: ${{ env.PROJECT_DIR }}
        run: |
          touch gradle.properties

          if grep -q "^android.useAndroidX=" gradle.properties; then
            sed -i 's/^android.useAndroidX=.*/android.useAndroidX=true/' gradle.properties
          else
            echo "android.useAndroidX=true" >> gradle.properties
          fi

          if grep -q "^android.enableJetifier=" gradle.properties; then
            sed -i 's/^android.enableJetifier=.*/android.enableJetifier=true/' gradle.properties
          else
            echo "android.enableJetifier=true" >> gradle.properties
          fi

      - name: Update Gradle Wrapper
        working-directory: ${{ env.PROJECT_DIR }}
        run: |
          sed -i 's#gradle-[0-9.]*-\(all\|bin\).zip#gradle-6.7.1-all.zip#' \
            gradle/wrapper/gradle-wrapper.properties

      - name: Download Orbitron Font
        working-directory: ${{ env.PROJECT_DIR }}
        run: |
          mkdir -p app/src/main/res/font

          curl -L \
            "https://github.com/google/fonts/raw/main/ofl/orbitron/static/Orbitron-Bold.ttf" \
            -o app/src/main/res/font/orbitron_bold.ttf

          if [ ! -s app/src/main/res/font/orbitron_bold.ttf ]; then
            echo "Font Orbitron gagal diunduh."
            exit 1
          fi

          file app/src/main/res/font/orbitron_bold.ttf
          ls -lh app/src/main/res/font/orbitron_bold.ttf

      - name: Make Gradle executable
        run: chmod +x "$PROJECT_DIR/gradlew"

      - name: Verify Gradle
        working-directory: ${{ env.PROJECT_DIR }}
        run: ./gradlew --version

      - name: Build Debug APK
        working-directory: ${{ env.PROJECT_DIR }}
        run: ./gradlew assembleDebug --stacktrace

      - name: Find APK
        run: |
          find "$PROJECT_DIR/app/build/outputs/apk" \
            -type f \
            -name "*.apk" \
            -print

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: black-phoenix-v2-debug
          path: ${{ env.PROJECT_DIR }}/app/build/outputs/apk/debug/*.apk
          if-no-files-found: error
