name: Build APK

on:
  workflow_dispatch:
  push:
    branches:
      - main

permissions:
  contents: read

jobs:
  build:
    name: Build Android APK
    runs-on: ubuntu-22.04

    steps:
      # =========================================================
      # 1. CHECKOUT
      # =========================================================
      - name: Checkout repository
        uses: actions/checkout@v4

      # =========================================================
      # 2. JAVA 17
      # =========================================================
      - name: Setup Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
          cache: gradle

      # =========================================================
      # 3. ANDROID SDK
      # =========================================================
      - name: Setup Android SDK
        uses: android-actions/setup-android@v3

      - name: Install Android SDK packages
        run: |
          yes | sdkmanager --licenses >/dev/null || true

          sdkmanager \
            "platform-tools" \
            "platforms;android-33" \
            "build-tools;33.0.0"

      # =========================================================
      # 4. SHOW REPOSITORY
      # =========================================================
      - name: Show repository
        run: |
          echo "========================================"
          echo "REPOSITORY"
          echo "========================================"
          pwd
          ls -lah

      # =========================================================
      # 5. EXTRACT ZIP
      # =========================================================
      - name: Extract Android project
        shell: bash
        run: |
          set -e

          rm -rf extracted
          mkdir -p extracted

          ZIP_FILE="Black Phoenix v1.zip"

          if [ ! -f "$ZIP_FILE" ]; then
            echo "ERROR: $ZIP_FILE tidak ditemukan."
            exit 1
          fi

          unzip -q "$ZIP_FILE" -d extracted

          echo "========================================"
          echo "EXTRACTED FILES"
          echo "========================================"

          find extracted -maxdepth 4 -type f | head -200

      # =========================================================
      # 6. FIND ANDROID PROJECT
      # =========================================================
      - name: Detect Android project
        shell: bash
        run: |
          set -e

          echo "========================================"
          echo "SEARCHING ANDROID PROJECT"
          echo "========================================"

          PROJECT_DIR=""

          # Prioritas project yang memiliki settings.gradle
          while IFS= read -r file; do
            DIR="$(dirname "$file")"

            if [ -f "$DIR/build.gradle" ] || \
               [ -f "$DIR/build.gradle.kts" ]; then
              PROJECT_DIR="$DIR"
              break
            fi
          done < <(find extracted -type f \
            \( -name "settings.gradle" -o -name "settings.gradle.kts" \) \
            -print)

          # Fallback: cari build.gradle
          if [ -z "$PROJECT_DIR" ]; then
            while IFS= read -r file; do
              DIR="$(dirname "$file")"

              if [ -d "$DIR/src" ] || [ -d "$DIR/app" ]; then
                PROJECT_DIR="$DIR"
                break
              fi
            done < <(find extracted -type f \
              \( -name "build.gradle" -o -name "build.gradle.kts" \) \
              -print)
          fi

          # Fallback sesuai struktur ZIP kamu sebelumnya
          if [ -z "$PROJECT_DIR" ] && [ -d "extracted/app" ]; then
            PROJECT_DIR="extracted/app"
          fi

          if [ -z "$PROJECT_DIR" ]; then
            echo "ERROR: Android project tidak ditemukan."
            echo
            echo "Gradle files:"
            find extracted -type f \
              \( -name "build.gradle" -o \
                 -name "build.gradle.kts" -o \
                 -name "settings.gradle" -o \
                 -name "settings.gradle.kts" \) \
              -print
            exit 1
          fi

          PROJECT_DIR="$(realpath "$PROJECT_DIR")"

          echo "ANDROID_PROJECT=$PROJECT_DIR" >> "$GITHUB_ENV"

          echo
          echo "Android project ditemukan:"
          echo "$PROJECT_DIR"

          echo
          echo "Project contents:"
          ls -lah "$PROJECT_DIR"

      # =========================================================
      # 7. REMOVE OLD BUILD/CACHE
      # =========================================================
      - name: Clean old build files
        shell: bash
        run: |
          set -e

          echo "Cleaning old generated files..."

          find "$ANDROID_PROJECT" -type d \
            \( -name build -o -name .gradle \) \
            -prune -exec rm -rf {} + || true

          echo "Old build files removed."

      # =========================================================
      # 8. INSTALL GRADLE 7.5
      # =========================================================
      - name: Setup Gradle 7.5
        run: |
          set -e

          GRADLE_VERSION="7.5"
          GRADLE_DIR="$RUNNER_TEMP/gradle-$GRADLE_VERSION"
          GRADLE_ZIP="$RUNNER_TEMP/gradle-$GRADLE_VERSION-bin.zip"

          wget -q \
            "https://services.gradle.org/distributions/gradle-${GRADLE_VERSION}-bin.zip" \
            -O "$GRADLE_ZIP"

          unzip -q "$GRADLE_ZIP" -d "$RUNNER_TEMP"

          echo "$GRADLE_DIR/bin" >> "$GITHUB_PATH"

      # =========================================================
      # 9. VERIFY ENVIRONMENT
      # =========================================================
      - name: Verify build environment
        run: |
          echo "========================================"
          echo "JAVA"
          echo "========================================"
          java -version

          echo
          echo "========================================"
          echo "GRADLE"
          echo "========================================"
          gradle --version

          echo
          echo "========================================"
          echo "ANDROID SDK"
          echo "========================================"
          echo "ANDROID_HOME=$ANDROID_HOME"

          echo
          echo "Installed SDK:"
          sdkmanager --list_installed || true

      # =========================================================
      # 10. CREATE CLEAN GRADLE PROPERTIES
      # =========================================================
      - name: Configure Gradle
        shell: bash
        run: |
          mkdir -p "$ANDROID_PROJECT/gradle"

          cat > "$ANDROID_PROJECT/gradle.properties" <<'EOF'
          org.gradle.jvmargs=-Xmx2048m -Dfile.encoding=UTF-8
          org.gradle.daemon=false
          org.gradle.parallel=false
          org.gradle.caching=false
          android.useAndroidX=true
          android.enableJetifier=true
          EOF

      # =========================================================
      # 11. BUILD DEBUG APK
      # =========================================================
      - name: Build Debug APK
        working-directory: ${{ env.ANDROID_PROJECT }}
        shell: bash
        run: |
          set -o pipefail

          echo "========================================"
          echo "BUILDING APK"
          echo "========================================"

          gradle \
            clean \
            assembleDebug \
            --no-daemon \
            --no-build-cache \
            --stacktrace

      # =========================================================
      # 12. FIND APK
      # =========================================================
      - name: Locate APK
        if: success()
        shell: bash
        run: |
          echo "========================================"
          echo "GENERATED APK"
          echo "========================================"

          find "$ANDROID_PROJECT" \
            -type f \
            -name "*.apk" \
            -print

      # =========================================================
      # 13. UPLOAD APK
      # =========================================================
      - name: Upload Debug APK
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: Black-Phoenix-Debug-APK
          path: |
            ${{ env.ANDROID_PROJECT }}/**/build/outputs/apk/debug/*.apk
          if-no-files-found: error
          retention-days: 30
