name: Build APK

on:
  workflow_dispatch:
  push:
    branches:
      - main
      - master

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      # 1. Checkout repository
      - name: Checkout repository
        uses: actions/checkout@v4

      # 2. Extract project ZIP
      - name: Extract Android project
        shell: bash
        run: |
          set -e

          echo "=== Repository ==="
          pwd
          ls -lah

          ZIP_FILE="Black Phoenix v1.zip"

          if [ ! -f "$ZIP_FILE" ]; then
            echo "ERROR: $ZIP_FILE tidak ditemukan!"
            exit 1
          fi

          rm -rf extracted
          mkdir -p extracted

          unzip -q -o "$ZIP_FILE" -d extracted

          echo "=== Extracted ==="
          find extracted -maxdepth 4 -type f \
            \( -name "gradlew" -o -name "settings.gradle" -o -name "settings.gradle.kts" \) \
            -print

      # 3. Cari root Gradle project secara otomatis
      - name: Find Gradle project
        shell: bash
        run: |
          set -e

          PROJECT_DIR=""

          # Cari gradlew terlebih dahulu
          GRADLEW=$(find extracted -type f -name gradlew | head -n 1 || true)

          if [ -n "$GRADLEW" ]; then
            PROJECT_DIR="$(dirname "$GRADLEW")"
          else
            # Fallback: cari settings.gradle
            SETTINGS=$(find extracted -type f \
              \( -name settings.gradle -o -name settings.gradle.kts \) \
              | head -n 1 || true)

            if [ -n "$SETTINGS" ]; then
              PROJECT_DIR="$(dirname "$SETTINGS")"
            fi
          fi

          if [ -z "$PROJECT_DIR" ]; then
            echo "ERROR: Project Gradle tidak ditemukan."
            echo "Isi extracted:"
            find extracted -maxdepth 5 -type f | head -n 200
            exit 1
          fi

          PROJECT_DIR="$(cd "$PROJECT_DIR" && pwd)"

          echo "PROJECT_DIR=$PROJECT_DIR" >> "$GITHUB_ENV"

          echo "=== Project ditemukan ==="
          echo "$PROJECT_DIR"
          ls -lah "$PROJECT_DIR"

      # 4. Setup Java 17
      - name: Setup Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
          cache: gradle

      # 5. Setup Android SDK
      - name: Setup Android SDK
        uses: android-actions/setup-android@v3

      # 6. Install SDK yang umum dibutuhkan
      - name: Install Android SDK
        shell: bash
        run: |
          set -e

          yes | sdkmanager --licenses >/dev/null || true

          sdkmanager \
            "platform-tools" \
            "platforms;android-33" \
            "build-tools;33.0.2"

      # 7. Pastikan Gradle wrapper executable
      - name: Prepare Gradle
        shell: bash
        run: |
          set -e

          cd "$PROJECT_DIR"

          if [ ! -f "./gradlew" ]; then
            echo "ERROR: gradlew tidak ditemukan di:"
            pwd
            ls -lah
            exit 1
          fi

          chmod +x ./gradlew

          echo "=== Gradle version ==="
          ./gradlew --version

      # 8. Build APK
      - name: Build Debug APK
        shell: bash
        env:
          GRADLE_OPTS: "-Dorg.gradle.daemon=false -Dorg.gradle.jvmargs=-Xmx3g -Dfile.encoding=UTF-8"
        run: |
          set -e

          cd "$PROJECT_DIR"

          echo "=== Cleaning ==="
          ./gradlew clean --no-daemon

          echo "=== Building APK ==="
          ./gradlew assembleDebug \
            --no-daemon \
            --stacktrace \
            --no-parallel

      # 9. Cari APK hasil build
      - name: Find APK
        shell: bash
        run: |
          echo "=== APK hasil build ==="

          find "$PROJECT_DIR" \
            -type f \
            -name "*.apk" \
            -print

      # 10. Upload APK
      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: Black-Phoenix-debug-apk
          path: |
            ${{ env.PROJECT_DIR }}/**/build/outputs/apk/**/*.apk
          if-no-files-found: error
          retention-days: 7
