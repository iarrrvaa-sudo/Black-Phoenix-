name: Build APK

on:
  push:
    branches:
      - main
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Java 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'

      - name: Setup Android SDK
        uses: android-actions/setup-android@v3
        with:
          cmdline-tools-version: '11076708'

      - name: Accept Android Licenses
        run: yes | sdkmanager --licenses || true

      - name: Install Android SDK
        run: |
          sdkmanager "platform-tools"
          sdkmanager "platforms;android-30"
          sdkmanager "build-tools;30.0.3"

      - name: Extract Android Project
        run: |
          mkdir -p project
          unzip -q "Black Phoenix v1.zip" -d project

      - name: Show Extracted Project
        run: |
          echo "=== PROJECT ==="
          find project -maxdepth 2 -type f | sort

      - name: Setup Java 8 for Gradle
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '8'

      - name: Setup Gradle 5.4.1
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '5.4.1'

      - name: Check Project
        working-directory: project
        run: |
          echo "=== ROOT ==="
          ls -la
          echo "=== APP ==="
          ls -la app
          echo "=== GRADLE WRAPPER ==="
          ls -la gradle/wrapper

      - name: Build Release APK
        working-directory: project
        run: gradle assembleRelease --stacktrace

      - name: Upload Release APK
        uses: actions/upload-artifact@v4
        with:
          name: Black-Phoenix-release
          path: project/app/build/outputs/apk/release/*.apk
          if-no-files-found: error
