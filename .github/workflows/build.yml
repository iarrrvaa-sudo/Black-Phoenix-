name: Build APK

on:
  workflow_dispatch:
  push:
    branches:
      - main

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Setup Android SDK
        uses: android-actions/setup-android@v3

      - name: Install Android SDK packages
        run: |
          sdkmanager "platform-tools" "platforms;android-33" "build-tools;33.0.0"

      - name: Check repository
        run: |
          echo "=== Repository ==="
          pwd
          ls -lah
          echo "=== ZIP ==="
          unzip -l "Black Phoenix v1.zip" | head -80

      - name: Extract project
        run: |
          rm -rf extracted
          mkdir -p extracted
          unzip -o "Black Phoenix v1.zip" -d extracted

          echo "=== Extracted ==="
          find extracted -maxdepth 3 -type f | head -100

      - name: Find Android project
        run: |
          echo "Searching for Gradle project..."

          find extracted -type f \( \
            -name "settings.gradle" -o \
            -name "settings.gradle.kts" -o \
            -name "build.gradle" -o \
            -name "build.gradle.kts" \
          \) -print

      - name: Prepare Gradle
        run: |
          PROJECT_DIR="extracted/app"

          if [ ! -f "$PROJECT_DIR/build.gradle" ] && [ ! -f "$PROJECT_DIR/build.gradle.kts" ]; then
            echo "ERROR: Android project not found in $PROJECT_DIR"
            exit 1
          fi

          echo "Project directory:"
          pwd
          echo "$PROJECT_DIR"

          ls -lah "$PROJECT_DIR"

          # Buat Gradle wrapper modern jika project lama tidak kompatibel
          if [ -f "$PROJECT_DIR/gradlew" ]; then
            chmod +x "$PROJECT_DIR/gradlew"
          fi

      - name: Install Gradle 7.5
        run: |
          wget -q https://services.gradle.org/distributions/gradle-7.5-bin.zip
          unzip -q gradle-7.5-bin.zip
          echo "$PWD/gradle-7.5/bin" >> "$GITHUB_PATH"

      - name: Check Gradle
        working-directory: extracted/app
        run: |
          gradle --version
          java -version

      - name: Build Debug APK
        working-directory: extracted/app
        run: |
          gradle clean assembleDebug --no-daemon --stacktrace

      - name: Find APK
        run: |
          echo "=== APK FILES ==="
          find extracted/app -type f -name "*.apk" -print

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: Black-Phoenix-debug
          path: extracted/app/**/build/outputs/apk/debug/*.apk
          if-no-files-found: error
