name: Build APK

on:
  push:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Java 17
        uses: actions/setup-java@v5
        with:
          distribution: 'temurin'
          java-version: '17'

      # 👇 GUNAKAN ACTION RESMI LEBIH AMAN DARI DOWNLOAD MANUAL
      - name: Setup Android SDK
        uses: android-actions/setup-android@v3
        with:
          api-level: 30
          build-tools: '30.0.3'
          cmdline-tools: 'latest'
        env:
          # Hindari cek versi JDK yang bikin error
          SKIP_JDK_VERSION_CHECK: 'true'

      # ✅ Cek dulu apakah file zip ada
      - name: Check source zip exists
        id: check_zip
        run: |
          if [ ! -f "Black Phoenix v1.zip" ]; then
            echo "❌ FILE TIDAK DITEMUKAN: Black Phoenix v1.zip"
            echo "Pastikan file ini sudah di-upload ke repo!"
            exit 1
          fi

      - name: Extract source code
        run: |
          mkdir -p project
          unzip -o "Black Phoenix v1.zip" -d project
          ls -la project

      - name: Make gradlew executable
        run: |
          chmod +x project/gradlew
          cd project && ./gradlew -v

      - name: Build APK
        working-directory: project
        run: ./gradlew assembleDebug --stacktrace

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: app-debug
          path: project/app/build/outputs/apk/debug/*.apk
          if-no-files-found: error
