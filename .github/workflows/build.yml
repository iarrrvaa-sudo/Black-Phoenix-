name: Build APK

on:
  workflow_dispatch:
  push:
    branches:
      - main

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Setup Android SDK
        uses: android-actions/setup-android@v3

      - name: Install Android SDK
        run: |
          yes | sdkmanager --licenses || true
          sdkmanager "platform-tools" "platforms;android-33" "build-tools;33.0.0"

      - name: Extract APK project
        run: |
          rm -rf extracted
          mkdir extracted

          unzip -q "Black Phoenix v1.zip" -d extracted

          echo "=== PROJECT STRUCTURE ==="
          find extracted -maxdepth 3 -type f \
            \( -name "build.gradle" -o \
               -name "build.gradle.kts" -o \
               -name "settings.gradle" -o \
               -name "settings.gradle.kts" \) \
            -print

      - name: Clean old build files
        run: |
          rm -rf extracted/app/build
          rm -rf extracted/app/.gradle

      - name: Install Gradle 7.5
        run: |
          wget -q https://services.gradle.org/distributions/gradle-7.5-bin.zip
          unzip -q gradle-7.5-bin.zip
          echo "$PWD/gradle-7.5/bin" >> "$GITHUB_PATH"

      - name: Check environment
        run: |
          java -version
          gradle --version
          echo "ANDROID_HOME=$ANDROID_HOME"
          ls -lah "$ANDROID_HOME/platforms"
          ls -lah "$ANDROID_HOME/build-tools"

      - name: Build APK
        working-directory: extracted/app
        run: |
          gradle clean assembleDebug \
            --no-daemon \
            --stacktrace \
            --warning-mode all

      - name: Find APK
        if: success()
        run: |
          echo "=== APK ==="
          find extracted/app -type f -name "*.apk" -print

      - name: Upload APK
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: Black-Phoenix-debug
          path: extracted/app/**/build/outputs/apk/debug/*.apk
          if-no-files-found: error
